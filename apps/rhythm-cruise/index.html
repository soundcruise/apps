<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リズムクルーズ</title>
</head>
<body>
    <p><a href="standard/">リズムクルーズを開く</a></p>
    <script>
        (function () {
            'use strict';

            function openStandard() {
                window.location.replace('standard/' + window.location.search + window.location.hash);
            }

            if (!('serviceWorker' in navigator)) {
                openStandard();
                return;
            }

            navigator.serviceWorker.getRegistration('./')
                .then(function (registration) {
                    var rootScope = new URL('./', window.location.href).href;
                    if (!registration || registration.scope !== rootScope) return false;
                    return registration.unregister();
                })
                .catch(function () {
                    return false;
                })
                .then(openStandard);
        }());
    </script>
</body>
</html>
