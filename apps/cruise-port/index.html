<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#090806">
    <title>クルーズポート</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../shared/pro-gate.css?v=5">
    <link rel="stylesheet" href="./style.css">
    <script>
        window.__SOUNDCRUISE_PRO_GATE__ = {
            passwordHash: 'fa68d2ed5f32f14746be3ce92a07e5dcc7431b3ac4e7717b6947a4054fae5c18',
            gateVersion: 8,
            appName: 'クルーズポート'
        };
    </script>
    <script src="../shared/pro-gate.js?v=19" defer></script>
    <script type="module" src="./practice-menu-app.js"></script>
</head>
<body>
    <div class="port-shell">
        <main id="home-view" class="port-view">
            <header class="port-header">
                <h1>クルーズポート</h1>
                <p class="port-concept">弾き語りに必要なアプリを1つに集約。</p>
            </header>

            <section class="port-section" aria-labelledby="cruise-apps-heading">
                <h2 id="cruise-apps-heading">クルーズアプリ</h2>
                <nav class="card-grid" aria-label="クルーズアプリ">
                    <a class="port-card app-card" href="../pitch-cruise/pro_x9v7q2m8/">
                        <img src="../pitch-cruise/pro_icon_192.png" alt="" width="192" height="192">
                        <span class="card-name">音感クルーズ</span>
                    </a>

                    <a class="port-card app-card" href="../fretboard_cruise/pro_a9f4k7q2m8z/">
                        <img src="../fretboard_cruise/generated-home-icons/final-selected-icon/fretboard-cruise-final-selection-192.png" alt="" width="192" height="192">
                        <span class="card-name">指板クルーズ</span>
                    </a>

                    <a class="port-card app-card" href="../rhythm-cruise/pro_r4m8k7n2q9x/">
                        <img src="../rhythm-cruise/pro_r4m8k7n2q9x/icon-192.png" alt="" width="192" height="192">
                        <span class="card-name">リズムクルーズ</span>
                    </a>

                    <a class="port-card app-card" href="../chord-cruise/pro_k7m4q9v2x8/">
                        <img src="../chord-cruise/icons/chord-cruise-pro-192.png" alt="" width="192" height="192">
                        <span class="card-name">コードクルーズ</span>
                    </a>
                </nav>
            </section>

            <section class="port-section" aria-labelledby="tools-heading">
                <h2 id="tools-heading">ツール</h2>
                <div class="card-grid">
                    <button class="port-card skeleton-card" type="button" disabled>
                        <span class="skeleton-icon" aria-hidden="true">
                            <svg viewBox="0 0 64 64" role="img">
                                <path d="M13 43a21 21 0 0 1 38 0" />
                                <path d="M20 36l-5-5M44 36l5-5M32 22v-7" />
                                <path class="icon-accent" d="M32 41l9-13" />
                                <circle class="icon-accent" cx="32" cy="41" r="3" />
                                <path d="M17 49h30" />
                            </svg>
                        </span>
                        <span class="card-name">チューナー</span>
                    </button>

                    <a class="port-card skeleton-card tool-card" id="metronome-card" href="#metronome">
                        <span class="skeleton-icon" aria-hidden="true">
                            <svg viewBox="0 0 64 64" role="img">
                                <path d="M23 13h18l8 39H15l8-39Z" />
                                <path d="M22 42h20" />
                                <path class="icon-accent" d="M32 39V18l10-5" />
                                <circle class="icon-accent" cx="32" cy="39" r="3" />
                            </svg>
                        </span>
                        <span class="card-name">メトロノーム</span>
                    </a>
                </div>
            </section>

            <section class="port-section" aria-labelledby="practice-heading">
                <div class="practice-heading-row">
                    <h2 id="practice-heading">練習メニュー</h2>
                    <div id="practice-reorder-actions" class="reorder-actions" hidden>
                        <button id="practice-reorder-cancel" class="reorder-button" type="button">キャンセル</button>
                        <button id="practice-reorder-complete" class="reorder-button reorder-button-primary" type="button">完了</button>
                    </div>
                    <button id="practice-reorder-start" class="reorder-button" type="button" hidden>並び替え</button>
                </div>
                <p id="practice-storage-error" class="notice notice-error" role="alert" hidden></p>
                <p id="practice-reorder-status" class="reorder-status" aria-live="polite" hidden></p>
                <p id="practice-reorder-notice" class="notice notice-error" role="alert" hidden></p>
                <div class="practice-list">
                    <div id="practice-menu-list"></div>
                    <button id="practice-menu-add" class="practice-row add-row" type="button">
                        <span class="add-symbol" aria-hidden="true">＋</span>
                        <span class="card-name">練習メニューを追加</span>
                    </button>
                </div>
            </section>

            <section class="port-section" aria-labelledby="my-apps-heading">
                <h2 id="my-apps-heading">My Apps</h2>
                <div class="card-grid">
                    <button class="port-card skeleton-card add-card my-app-card" type="button" disabled>
                        <span class="add-symbol" aria-hidden="true">＋</span>
                        <span class="card-name">アプリを追加</span>
                    </button>
                </div>
            </section>
        </main>

        <main id="practice-detail-view" class="port-view detail-view" hidden>
            <button class="view-back" type="button" data-action="home">← クルーズポート</button>
            <article class="view-panel" aria-labelledby="practice-detail-title">
                <p class="view-kicker">練習メニュー</p>
                <h1 id="practice-detail-title" class="view-title" tabindex="-1"></h1>

                <dl class="detail-list">
                    <div>
                        <dt>練習時間</dt>
                        <dd id="practice-detail-duration"></dd>
                    </div>
                    <div>
                        <dt>使用アプリ</dt>
                        <dd id="practice-detail-app"></dd>
                    </div>
                    <div>
                        <dt>メモ</dt>
                        <dd id="practice-detail-memo" class="detail-memo"></dd>
                    </div>
                </dl>

                <p id="practice-detail-error" class="notice notice-error" role="alert" hidden></p>
                <div class="view-actions">
                    <a id="practice-open-app" class="action-button primary-action" href="#"></a>
                    <button id="practice-edit" class="action-button secondary-action" type="button">編集</button>
                    <button id="practice-delete" class="action-button danger-action" type="button">削除</button>
                </div>
            </article>
        </main>

        <main id="practice-form-view" class="port-view form-view" hidden>
            <button class="view-back" type="button" data-action="cancel-form">← 戻る</button>
            <section class="view-panel" aria-labelledby="practice-form-title">
                <p class="view-kicker">練習メニュー</p>
                <h1 id="practice-form-title" class="view-title" tabindex="-1">練習メニューを作成</h1>

                <form id="practice-menu-form" novalidate>
                    <div class="form-field">
                        <label for="practice-name">メニュー名 <span class="required-label">必須</span></label>
                        <input id="practice-name" name="name" type="text" maxlength="100" autocomplete="off" required>
                    </div>

                    <div class="form-field">
                        <label for="practice-duration">練習時間 <span class="required-label">必須</span></label>
                        <div class="duration-input">
                            <input id="practice-duration" name="durationMinutes" type="number" min="1" max="999" step="1" inputmode="numeric" required>
                            <span>分</span>
                        </div>
                    </div>

                    <div class="form-field">
                        <label for="practice-app">使用アプリ <span class="required-label">必須</span></label>
                        <select id="practice-app" name="appId" required>
                            <option value="">選択してください</option>
                            <option value="pitch">音感クルーズ</option>
                            <option value="fretboard">指板クルーズ</option>
                            <option value="rhythm">リズムクルーズ</option>
                            <option value="chord">コードクルーズ</option>
                            <option value="metronome">メトロノーム</option>
                        </select>
                    </div>

                    <div class="form-field">
                        <label for="practice-memo">メモ <span class="optional-label">任意・1000文字以内</span></label>
                        <textarea id="practice-memo" name="memo" maxlength="1000" rows="6"></textarea>
                    </div>

                    <p id="practice-form-error" class="notice notice-error" role="alert" hidden></p>
                    <div class="form-actions">
                        <button class="action-button primary-action" type="submit">保存</button>
                        <button class="action-button secondary-action" type="button" data-action="cancel-form">キャンセル</button>
                    </div>
                </form>
            </section>
        </main>

        <main id="metronome-view" class="port-view metronome-view" hidden>
            <button class="view-back" type="button" data-action="home">← クルーズポート</button>
            <section class="view-panel metronome-panel" aria-labelledby="metronome-title">
                <p class="view-kicker">ツール</p>
                <h1 id="metronome-title" class="view-title metronome-title" tabindex="-1">メトロノーム</h1>

                <div class="tempo-display">
                    <label class="visually-hidden" for="metronome-bpm">テンポ</label>
                    <input id="metronome-bpm" class="tempo-value" type="number" min="30" max="240" step="1" inputmode="numeric" value="120">
                    <span class="tempo-unit">BPM</span>
                    <p id="metronome-tempo-note" class="tempo-note" hidden>付点4分音符＝BPM</p>
                </div>

                <div class="tempo-steps" aria-label="テンポ調整">
                    <button type="button" data-bpm-delta="-5">−5</button>
                    <button type="button" data-bpm-delta="-1">−1</button>
                    <button type="button" data-bpm-delta="1">＋1</button>
                    <button type="button" data-bpm-delta="5">＋5</button>
                </div>

                <div id="metronome-beats" class="beat-display" role="img" aria-label="4分の4拍子、停止中"></div>

                <div class="metronome-settings">
                    <label class="metronome-field" for="metronome-meter">
                        <span>拍子</span>
                        <select id="metronome-meter">
                            <option value="2/4">2/4</option>
                            <option value="3/4">3/4</option>
                            <option value="4/4" selected>4/4</option>
                            <option value="6/8">6/8</option>
                        </select>
                    </label>

                    <label class="metronome-field" for="metronome-sound">
                        <span>クリック音</span>
                        <select id="metronome-sound">
                            <option value="standard" selected>スタンダード</option>
                            <option value="wood">ウッド</option>
                            <option value="click">クリック</option>
                            <option value="drum">ドラム</option>
                        </select>
                    </label>

                    <label class="metronome-field volume-field" for="metronome-volume">
                        <span>音量 <output id="metronome-volume-value" for="metronome-volume">70</output></span>
                        <input id="metronome-volume" type="range" min="0" max="100" step="1" value="70">
                    </label>
                </div>

                <p id="metronome-storage-error" class="notice notice-error" role="alert" hidden></p>
                <p id="metronome-status" class="metronome-status" aria-live="polite">停止中</p>

                <div class="metronome-actions">
                    <button id="metronome-toggle" class="action-button primary-action metronome-toggle" type="button">▶ 開始</button>
                    <button id="metronome-tap" class="action-button secondary-action metronome-tap" type="button">TAP</button>
                    <p id="metronome-tap-status" class="tap-status" aria-live="polite">タップしてテンポを測定</p>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
