<!doctype html><meta charset="utf-8"><title>Account / Port inert cutover fixture</title>
<script src="../../shared/sync-account/sync-account-db.js"></script>
<output id="result">Isolated, canWrite=false</output>
<script type="module">
import {setupCutover} from './authority-store/account-cutover-fixture.mjs';
import {control,values} from './authority-store/fixture.mjs';
import {account,identity} from './authority-store/account-provider-fixture.mjs';
import {createIsolatedAccountMutationStore} from '../../shared/sync-account/account-mutation-receipts.mjs';
import {portAccountMutationBinding} from '../port-account-coordination.mjs';
let x,pause=null,entered=false,release,prepared;
window.cutoverFixture={
 async init({scopeName,seed=true}){x?.dispose();if(seed)for(const [k,v] of Object.entries(values()))if(v!==null)localStorage.setItem(k,v);
  x=await setupCutover({indexedDB,root:SoundCruiseSyncAccount,scopeName,seed,storage:localStorage,

  if(!(await m.mutate({context:await m.capture(),binding,nextAccount:account('B')})).ok)throw Error('B-CAS-failed');

</script>
