<!doctype html><html lang="ja"><meta charset="utf-8"><link rel="icon" href="data:,"><title>Isolated explicit credential adoption</title><p>Account CAS / stopped intent / Shared Write OFF</p>
<script src="../../shared/sync-account/sync-account-db.js"></script><script src="../../shared/sync-account/sync-account-client.js"></script>
<script type="module">
import {setupBrowserSaveAdmission} from './authority-store/save-admission-browser-fixture.mjs';
import {createTestAuthorityScope} from './authority-store/test-authority.mjs';
import {createIsolatedRenewalVault,createIsolatedRenewalRecoveryClient} from '../port-renewal-recovery-isolated.mjs';
import {createIsolatedCredentialAdoption} from '../port-credential-adoption-isolated.mjs';
import {digest} from '../port-idb-authority-contract.mjs';
let x,vault,client,owner,candidate,name,record,credentials,renewalOperationId,phase;
const api=(action,input={})=>fetch('/__clock_fixture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,action,...input})}).then(r=>r.json());
const dispatch=req=>{const h=new Headers(req.headers);h.set('X-Isolated-Fixture',name);return fetch(new Request(req,{headers:h}));};
const send=async(path,body)=>{const r=await dispatch(new Request(new URL('/__isolated/account/v1/'+path,location.origin),{method:'POST',headers:{'Content-Type':'application/json',Authorization:credentials.accountAuthorization},body:JSON.stringify(body)}));return {status:r.status,body:await r.json()};};
window.adoptionFixture={async init(o){name=o.name;phase=o.phase;renewalOperationId=o.renewalOperationId;const d=await api('init');credentials=d.credentials;record=d.account;x=await setupBrowserSaveAdmission({indexedDB,root:SoundCruiseSyncAccount,name,seed:o.seed,record});vault=createIsolatedRenewalVault({indexedDB,scopeName:name});const opts={indexedDB,source:x.mutationStore,vault,url:location.origin+'/__isolated/account/v1/',dispatch};
 client=createIsolatedRenewalRecoveryClient({...opts,scope:x.scope});const scope=createTestAuthorityScope({indexedDB,name,partitionId:'fixture-partition',now:()=>x.clock.wall,monotonicNow:()=>x.clock.mono,clockIdentity:()=>x.clock.origin});
 owner=await createIsolatedCredentialAdoption({...opts,scope,accountStorage:SoundCruiseSyncAccount.storage,locks:navigator.locks,checkpoint:p=>{if(p===phase)throw Error('crash');}});return {ok:true};},
 async renew(){const start=await send('credential/renew/begin',await api('beginRequest'));if(start.status!==200)return {ok:false};const h=await client.prepare({request:await api('lifecycle'),identity:{accountId:'A',accountDeviceId:record.accountDeviceId,membershipId:'member-A'}});if(!h.ok)return h;renewalOperationId=h.operationId;const r=await client.finish(h);return {ok:r.ok,reason:r.reason,renewalOperationId};},
 async inspect(id=renewalOperationId){candidate=await owner.inspect({renewalOperationId:id,generation:'g1'});return candidate;},
 adopt:(operationId,explicit=true)=>owner.adopt({candidate,operationId,explicit}),reconcile:operationId=>owner.reconcile({operationId}),
 async state(){const rows=await x.rows(),h=await x.store.hydrate('g1');return {accountDigest:digest(rows),credentialChanged:rows.find(r=>r[0]==='account')[1].accountCredential!==record.accountCredential,stopped:h.snapshot.control.identityInvalidated,authorityDigest:digest(h),canWrite:false};},
 async aba(){await x.mutationStore.auxiliary({context:await x.mutationStore.capture(),key:'pendingStart',value:{fixture:true},write:true});await x.mutationStore.auxiliary({context:await x.mutationStore.capture(),key:'pendingStart',remove:true,write:true});},
 async loseKey(){const db=await new Promise((r,j)=>{const q=indexedDB.open('sound-cruise-sync-app-backups');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error);});await new Promise((r,j)=>{const tx=db.transaction('backups','readwrite'),s=tx.objectStore('backups'),q=s.getAll();q.onsuccess=()=>{const row=q.result.find(v=>v.packet?.operationId===renewalOperationId);delete row.packet.key;s.put(row);};tx.oncomplete=r;tx.onabort=()=>j(tx.error);});db.close();},
 revoke:()=>api('revoke')
};
</script></html>
