<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEWS Operator Review — Cruise</title><link rel="stylesheet" href="/review.css"><script defer src="/review.js"></script></head><body><main><header><p class="eyebrow">CRUISE · 管理専用</p><h1>NEWS Review</h1><p id="identity">認証を確認しています…</p></header><section id="dashboard" aria-label="運用状況"><p class="meta">運用状況を読み込んでいます…</p></section><details id="human-history"><summary>人間の判断履歴</summary><p class="meta">直近365日。記事名や認証情報は表示しません。</p><section id="history-list" aria-label="人間判断一覧"></section><button id="history-more" hidden>さらに表示</button></details><p id="notice" role="status" aria-live="polite"></p><button id="retry" hidden>前回の判断結果を確認・再送</button><nav aria-label="候補フィルター"><label>表示<select id="mode"><option value="all">すべての保留</option><option value="approvable">掲載可</option><option value="PUBLISH_REVIEW">REVIEWのみ</option></select></label><label>情報源<select id="source"><option value="all">すべての情報源</option></select></label><button id="reload">更新</button></nav><h2 id="count">保留</h2><section id="list" aria-label="保留一覧"></section><dialog id="confirm"><form method="dialog"><h2 id="confirm-title"></h2><p id="confirm-label"></p><label>判断理由<select id="reason"></select></label><fieldset id="checks"><legend>掲載前の確認</legend><label><input type="checkbox" name="factsChecked">原文で製品・内容・日付を確認しました</label><label><input type="checkbox" name="relevanceChecked">Cruiseのニュースとして有用です</label><label><input type="checkbox" name="duplicateChecked">既存の掲載内容と重複していません</label><label><input type="checkbox" name="independentLabelChecked">表示labelは事実に基づく独自表現です</label></fieldset><p id="confirmation-note">判断は履歴に保存されます。</p><div class="actions"><button value="cancel">戻る</button><button id="submit" type="button">判断を確定</button></div></form></dialog></main></body></html>
